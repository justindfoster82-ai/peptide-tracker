<style>

.mut{color:var(--mut);font-size:14px}.big{font-size:22px;font-weight:700}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;background:#2a2f3a}
.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}

body{background:radial-gradient(1200px 600px at 10% -10%,#3a1d6e55,transparent),radial-gradient(900px 500px at 110% 10%,#00d4ff33,transparent),var(--bg);background-attachment:fixed}
header{background:linear-gradient(90deg,#00e5ff,#a855f7,#ff3cac,#00e5ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s linear infinite}

.card{background:rgba(26,29,40,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 30px #0006,inset 0 1px 0 #ffffff10;animation:cin .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}

button{position:relative;overflow:hidden;transition:transform .12s,filter .12s}button:active{transform:scale(.96);filter:brightness(1.15)}

.rip{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rip .5s ease-out;pointer-events:none}@keyframes rip{to{transform:scale(4);opacity:0}}
nav{background:rgba(15,17,24,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}nav button.on{color:#fff;text-shadow:0 0 10px #a855f7}

.ring circle.fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);animation:ring 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dashoffset:var(--c)}}
.boom{position:fixed;left:50%;top:45%;z-index:99;pointer-events:none}.boom i{position:absolute;width:9px;height:9px;border-radius:2px;animation:conf 1s cubic-bezier(.1,.7,.3,1) forwards}

.boom b{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00e676,#00bfa5);display:grid;place-items:center;font-size:44px;color:#fff;animation:pop .9s ease forwards}

header{display:flex;align-items:center;gap:10px}header .ic{width:26px;height:26px;color:#00e5ff;filter:drop-shadow(0 0 6px #00e5ff88)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

<script>
const K='peplog.v1',$=s=>document.querySelector(s),DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SITES=['L abdomen','R abdomen','L thigh','R thigh','L glute','R glute','L delt','R delt'];
const uid=()=>Math.random().toString(36).slice(2,10);
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date()),r2=x=>Math.round(x*100)/100,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEED={protocols:[
{id:'ghk',name:'GHK-Cu',unit:'mg',vialMg:100,bacMl:3,doseMg:1,stepDate:'2026-10-30',stepDoseMg:2,schedType:'dow',days:[1,2,3,4,5],every:1,time:'16:30',start:'2026-10-23',end:'',mixed:'',notes:'SubQ. Sat/Sun off.'},
{id:'reta',name:'Retatrutide',unit:'mg',vialMg:20,bacMl:2,doseMg:4,stepDate:'',stepDoseMg:'',schedType:'dow',days:[6],every:7,time:'09:00',start:'2026-10-24',end:'',mixed:'2026-10-23',notes:'Weekly. Time is a placeholder.'}],logs:[],vitals:[]};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.protocols)S=JSON.parse(JSON.stringify(SEED));
S.protocols.forEach(p=>p.unit=p.unit||'mg');
const save=()=>localStorage.setItem(K,JSON.stringify(S));save();
const U=p=>p.unit==='IU'?'IU':'mg';
const conc=p=>p.vialMg&&p.bacMl?p.vialMg/p.bacMl:0;
const doseOn=(p,d)=>p.stepDate&&p.stepDoseMg&&d>=p.stepDate?+p.stepDoseMg:+p.doseMg;
const units=(p,mg)=>conc(p)?r2(mg/conc(p)*100):null;
function due(p,d){if(!p.start||d<p.start||(p.end&&d>p.end))return false;
 if(p.schedType==='every'){const n=Math.round((pd(d)-pd(p.start))/864e5);return n%Math.max(1,+p.every||1)===0}
 return (p.days||[]).includes(pd(d).getDay())}
const logFor=(pid,d)=>S.logs.find(l=>l.pid===pid&&l.date===d);
function supply(p){if(!p.vialMg)return null;const from=p.mixed||'0000';
 let rem=+p.vialMg-S.logs.filter(l=>l.pid===p.id&&l.status==='taken'&&l.date>=from).reduce((a,l)=>a+(+l.doseMg||0),0);
 let left=0,last=null,d=today();if(p.mixed&&d<p.mixed)d=p.mixed;
 for(let i=0;i<1500;i++,d=addD(d,1)){if(p.end&&d>p.end)break;if(due(p,d)&&!logFor(p.id,d)){const m=doseOn(p,d);if(rem+1e-9<m)break;rem-=m;left++;last=d}}
 const exp=p.mixed?addD(p.mixed,28):null;return{rem:r2(rem),left,last,exp}}
function missed(){const out=[],t=today();for(const p of S.protocols){let d=p.start>addD(t,-60)?p.start:addD(t,-60);for(;d&&d<t;d=addD(d,1))if(due(p,d)&&!logFor(p.id,d))out.push({p,d})}return out.sort((a,b)=>b.d.localeCompare(a.d))}
const fmt=d=>pd(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

ide+SURMOUNT-1+Jastreboff+2022"]],"al":"Mounjaro Zepbound"},{"n":"Retatrutide","c":"Metabolic / weight","hl":"About 6 days (phase 1 PK; cited in NEJM phase 2 paper).","what":"Investigational triple GIP/GLP-1/glucagon receptor agonist (Eli Lilly).","mech":"Agonist at GIP, GLP-1 and glucagon receptors; glucagon arm adds energy expenditure and liver fat reduction.","ben":"Phase 2: up to ~24% weight loss at 48 weeks. Phase 3 TRIUMPH-1 (2026): -19.0% (4 mg), -25.9% (9 mg), -28.3% (12 mg) at 80 weeks vs -2.2% placebo.","ev":"Human RCT (phase 2 and phase 3).","fda":"Not FDA approved (investigational; not approved anywhere as of Oct 2026). Lilly has said it plans to file in early 2027. FDA says it cannot be compounded.","wada":"Not prohibited.","dose":"Trials used 4, 9 or 12 mg weekly maintenance after titration (phase 2: 1–12 mg).","risk":"GI effects, dose-dependent heart-rate increase, possible arrhythmia signal; gray-market product purity unknown.","bp":"Phase 2 showed BP reductions; heart rate rose. Log BP and pulse; BP meds may need lowering as weight drops.","src":[["NEJM 2023 phase 2 (Jastreboff)","https://www.nejm.org/doi/full/10.1056/NEJMoa2301972"],["Lilly: TRIUMPH-1 phase 3 results","https://investor.lilly.com/news-releases/news-release-details/lillys-triple-agonist-retatrutide-delivered-powerful-weight-loss"],["Lilly: What to know about retatrutide","https://www.lilly.com/news/stories/what-to-know-about-retatrutide"]],"al":""},{"n":"Liraglutide","c":"Metabolic / weight","hl":"About 13 hours (FDA label).","what":"Daily GLP-1 receptor agonist (Victoza, Saxenda).","mech":"GLP-1 receptor agonist.","ben":"~8% weight loss (SCALE), A1c reduction, CV benefit (LEADER).","ev":"Human RCT.","fda":"FDA approved.","wada":"Not prohibited.","dose":"Label: Saxenda 0.6 → 3.0 mg daily; Victoza up to 1.8 mg daily.","risk":"GI effects, gallbladder disease, pancreatitis; thyroid C-cell boxed warning.","bp":"Modest BP reduction; slight heart-rate increase.","src":[["FDA label (DailyMed): liraglutide","https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=liraglutide"],["PubMed: liraglutide SCALE obesity trial","https://pubmed.ncbi.nlm.nih.gov/?term=liraglutide+SCALE+obesity+trial"]],"al":"Saxenda Victoza"},{"n":"Exenatide","c":"Metabolic / weight","hl":"About 2.4 hours (Byetta label); extended-release form is weekly.","what":"First GLP-1 agonist, derived from Gila monster exendin-4 (Byetta, Bydureon).","mech":"GLP-1 receptor agonist.","ben":"A1c reduction, modest weight loss.","ev":"Human RCT.","fda":"FDA approved.","wada":"Not prohibited.","dose":"Label: Byetta 5–10 mcg twice daily; Bydureon BCise 2 mg weekly.","risk":"GI effects, pancreatitis, kidney injury with dehydration.","bp":"Modest BP reduction.","src":[["FDA label (DailyMed): exenatide","https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=exenatide"]],"al":"Byetta Bydureon"},{"n":"Dulaglutide","c":"Metabolic / weight","hl":"About 5 days (FDA label).","what":"Weekly GLP-1 agonist (Trulicity).","mech":"GLP-1 receptor agonist fused to Fc fragment.","ben":"A1c reduction, CV benefit (REWIND).","ev":"Human RCT.","fda":"FDA approved.","wada":"Not prohibited.","dose":"Label: 0.75 → up to 4.5 mg weekly.","risk":"GI effects, pancreatitis; thyroid C-cell boxed warning.","bp":"Small BP reduction.","src":[["FDA label (DailyMed): dulaglutide","https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=dulaglutide"]],"al":"Trulicity"},{"n":"Cagrilintide","c":"Metabolic / weight","hl":"About 7–8 days (~184 h reported; supports once-weekly dosing).","what":"Long-acting amylin analog (Novo Nordisk), studied with semaglutide as CagriSema.","mech":"Amylin and calcitonin receptor agonist; satiety, slower gastric emptying.","ben":"CagriSema: 22.7% weight loss at 68 weeks (REDEFINE 1); cagrilintide alone 11.8%. Did not beat tirzepatide 15 mg in REDEFINE 4.","ev":"Human RCT (phase 3).","fda":"Not FDA approved (CagriSema NDA filed Dec 2025; decision expected Q4 2026). FDA says cagrilintide cannot be compounded.","wada":"Not prohibited.","dose":"Trials: titrated to 2.4 mg weekly (with semaglutide 2.4 mg).","risk":"GI effects.","bp":"Weight-loss BP reduction expected; data limited.","src":[["Novo Nordisk: CagriSema NDA submission","https://www.novonordisk-us.com/media/press-releases/novo-nordisk-cagrisema-fda-nda-submission.html"],["Drugs.com: CagriSema approval history","https://www.drugs.com/history/cagrisema.html"]],"al":""},{"n":"Pramlintide","c":"Metabolic / weight","hl":"About 48 minutes (FDA label).","what":"Amylin analog (Symlin) used with mealtime insulin.","mech":"Amylin receptor agonist.","ben":"Lower post-meal glucose, modest weight loss.","ev":"Human RCT.","fda":"FDA approved.","wada":"Not prohibited.","dose":"Label: 15–120 mcg before meals depending on diabetes type.","risk":"Severe hypoglycemia with insulin (boxed warning), nausea.","bp":"No major BP effect known.","src":[["Symlin FDA label","https://www.accessdata.fda.gov/drugsatfda_docs/label/2015/021332s023lbl.pdf"]],"al":"Symlin"},{"n":"Mazdutide","c":"Metabolic / weight","hl":"About 10 days in adults with obesity (China NMPA label).","what":"GLP-1/glucagon dual agonist (Innovent/Lilly, LY3305677).","mech":"Agonist at GLP-1 and glucagon receptors.","ben":"Phase 3 weight loss in China (GLORY-1, NEJM 2025); approved in China June 24, 2025 for weight management.","ev":"Human RCT.","fda":"Not FDA approved.","wada":"Not prohibited.","dose":"China label: titrated to 4 or 6 mg weekly.","risk":"GI effects, heart-rate increase.","bp":"Trials reported BP reductions.","src":[["NEJM 2025 GLORY-1 (PubMed)","https://pubmed.ncbi.nlm.nih.gov/40421736/"],["Mazdutide China label (Innovent, PDF)","https://img.innoventbio.com/product/W10030842001.pdf"]],"al":""},{"n":"Survodutide","c":"Metabolic / weight","hl":"About 130 hours (~5.4 days) in healthy participants (phase 1, J Hepatol).","what":"GLP-1/glucagon dual agonist (Boehringer Ingelheim, BI 456906).","mech":"Agonist at GLP-1 and glucagon receptors.","ben":"Phase 3 SYNC  <div class="cal" style="margin-top:8px">${DOW.map(d=>`<div style="background:none;min-height:0;text-align:center" class="mut">${d[0]}</div>`).join('')}${c}</div>
 <p class="mut"><span class="dot" style="background:var(--ok)"></span>taken <span class="dot" style="background:var(--ac)"></span>due <span class="dot" style="background:var(--bad)"></span>missed</p><h3>Next 7 days</h3>${w}`},
log(){const L=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date));$('#v').innerHTML=L.length?L.map(l=>{const p=S.protocols.find(x=>x.id===l.pid);
 return `<div class="card"><div class="row"><div><b>${esc(p?p.name:'(deleted)')}</b> · ${l.doseMg} ${p?U(p):''}<div class="mut">${fmt(l.date)} · ${l.status==='taken'?'taken '+new Date(l.takenAt).toLocaleString():'skipped'}${l.site?' · '+esc(l.site):''}</div>${l.notes?`<div>${esc(l.notes)}</div>`:''}</div><button class="sec" onclick="takeDlg('${l.pid}','${l.date}','${l.id}')">Edit</button></div></div>`}).join(''):'<div class="card mut">No entries yet.</div>'},
vit(){const V2=[...S.vitals].sort((a,b)=>a.date.localeCompare(b.date));
 $('#v').innerHTML=`<div class="card"><div class="g2"><div><label>Date</label><input id="vd" type="date" value="${today()}"></div><div><label>Weight (lb)</label><input id="vw" type="number" step="0.1" inputmode="decimal"></div>
 <div><label>Systolic</label><input id="vs" type="number" inputmode="numeric"></div><div><label>Diastolic</label><input id="vdi" type="number" inputmode="numeric"></div></div>
 <label>Pulse (optional)</label><input id="vp" type="number" inputmode="numeric"><p><button style="width:100%" onclick="addVit()">Save reading</button></p></div>
 <div class="card"><b>Weight</b>${chart(V2,[['w','#4f9cff']])}</div><div class="card"><b>Blood pressure</b>${chart(V2,[['sys','#ff5c5c'],['dia','#ffb020']])}</div>
 ${V2.slice().reverse().map(v=>`<div class="card row"><div>${fmt(v.date)}<div class="mut">${v.w?v.w+' lb ':''}${v.sys?v.sys+'/'+v.dia+' ':''}${v.pulse?'♥'+v.pulse:''}</div></div><button class="dan" onclick="S.vitals=S.vitals.filter(x=>x.id!=='${v.id}');save();V.vit()">✕</button></div>`).join('')}`},
tools(){$('#v').innerHTML=`<div class="card"><b>Reverse BAC calculator</b><p class="mut">How much water to add so a dose is a given number of units (U-100).</p>
 <div class="g2"><div><label>Vial mg</label><input id="rv" type="number" value="10"></div><div><label>Dose mg</label><input id="rd" type="number" value="1"></div></div>
 <label>Units wanted per dose</label><input id="ru" type="number" value="10"><p class="big" id="rout"></p></div>
 <div class="card" id="hghcalc"><b>HGH / IU reconstitution calculator</b>
 <div class="g2"><div><label>Vial IU</label><input id="hv" type="number" step="any" value="36"></div><div><label>Water mL</label><input id="hm" type="number" step="any" value="1.8"></div></div>
 <div class="row" style="margin-top:8px">${[1,2,1.8].map(m=>`<button class="sec" style="flex:1" onclick="$('#hm').value=${m};hf()">${m} mL</button>`).join('')}</div>
 <label>Dose IU</label><input id="hd" type="number" step="any" value="2"><div id="hout" class="big" style="margin-top:8px"></div>
 <p class="mut">Reverse: units wanted per dose → water to add</p><label>Target units per dose</label><input id="hu" type="number" step="any" value="10"><p class="big" id="hrout"></p></div>
 <div class="card"><b>Calendar reminders</b><p class="mut">Download an .ics with the next 8 weeks of doses (with 0-min alerts) and open it to add to your phone calendar.</p><button onclick="ics()" style="width:100%">Export .ics</button></div>
 <div class="card"><b>Backup</b><p class="mut">Data is saved on this device only. Export a backup regularly.</p><div class="g2"><button onclick="exportJ()">Export JSON</button><button class="sec" onclick="$('#imp').click()">Import JSON</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJ(this)"></div>
 <p class="mut">Educational tool, not medical advice.</p>`;
 const f=()=>{const v=+$('#rv').value,d=+$('#rd').value,u=+$('#ru').value;$('#rout').textContent=v&&d&&u?`Add ${r2(v*u/(d*100))} mL BAC water → ${r2(d*100/u)} mg/mL`:''};['#rv','#rd','#ru'].forEach(s=>$(s).oninput=f);f();['#hv','#hm','#hd','#hu'].forEach(s=>$(s).oninput=hf);hf()}};
function hf(){const v=+$('#hv').value,m=+$('#hm').value,d=+$('#hd').value,u=+$('#hu').value;
 $('#hout').innerHTML=v&&m&&d?`${r2(v/m)} IU/mL<br>${r2(d/(v/m)*100)} units per dose<br>${Math.floor(v/d+1e-9)} doses per vial<br>${Math.floor(v/d+1e-9)} days per vial (daily)`:'';
 $('#hrout').textContent=v&&d&&u?`Add ${r2(v*u/(d*100))} mL → ${r2(d*100/u)} IU/mL`:''}
function ring(f,label,sub,col){f=Math.max(0,Math.min(1,f||0));const r=30,c=2*Math.PI*r;return `<svg class="ring" width="76" height="76" viewBox="0 0 76 76" style="--c:${c}"><defs><linearGradient id="rg${col}" x1="0" x2="1"><stop offset="0" stop-color="${col==='a'?'#00e5ff':'#00e676'}"/><stop offset="1" stop-color="${col==='a'?'#a855f7':'#00bfa5'}"/></linearGradient></defs><circle cx="38" cy="38" r="${r}" fill="none" stroke="#ffffff14" stroke-width="7"/><circle class="fg" cx="38" cy="38" r="${r}" fill="none" stroke="url(#rg${col})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 38 38)"/><text x="38" y="${sub?36:43}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${label}</text>${sub?`<text x="38" y="51" text-anchor="middle" fill="#8a92a6" font-size="9">${sub}</text>`:''}</svg>`}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=document.createElement('div');b.className='boom';let h='<b>✓</b>';const C=['#00e5ff','#a855f7','#ff3cac','#00e676','#ffd166'];for(let i=0;i<28;i++){const a=Math.random()*6.283,d=90+Math.random()*120;h+=`<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${C[i%5]}"></i>`}b.innerHTML=h;document.body.appendChild(b);setTimeout(()=>b.remove(),1100)}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),500)});
new MutationObserver(()=>document.querySelectorAll('#v .card').forEach((c,i)=>c.style.setProperty('--i',Math.min(i,12)))).observe(document.getElementById('v'),{childList:true});
function chart(data,series){const pts=data.filter(v=>series.some(([k])=>v[k]));if(pts.length<1)return '<p class="mut">No data yet.</p>';
 const W=340,H=150,vals=pts.flatMap(v=>series.map(([k])=>+v[k]).filter(Boolean)),mn=Math.min(...vals)-2,mx=Math.max(...vals)+2,x=i=>pts.length<2?W/2:10+i*(W-20)/(pts.length-1),y=v=>H-10-(v-mn)/(mx-mn)*(H-20);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${series.map(([k,c])=>{const ps=pts.map((v,i)=>v[k]?[x(i),y(+v[k])]:null).filter(Boolean);return `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${ps.map(p=>p.join(',')).join(' ')}"/>`+ps.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${c}"/>`).join('')}).join('')}<text x="2" y="12" fill="#8a92a6" font-size="11">${r2(mx)}</text><text x="2" y="${H-2}" fill="#8a92a6" font-size="11">${r2(mn)}</text></svg>`}
function addVit(){const v={id:uid(),date:$('#vd').value,w:$('#vw').value,sys:$('#vs').value,dia:$('#vdi').value,pulse:$('#vp').value};if(!v.w&&!v.sys)return alert('Enter weight or BP');S.vitals.push(v);save();V.vit()}
function bindTake(){document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const[a,d]=b.dataset.take.split('|');takeDlg(a,d)})}
function takeDlg(pid,d,lid){const p=S.protocols.find(x=>x.id===pid),l=lid?S.logs.find(x=>x.id===lid):null,mg=l?l.doseMg:p?doseOn(p,d):'';
 const now=new Date(),ts=l?l.takenAt:(d===today()?now.toISOString():pd(d).toISOString()),loc=new Date(new Date(ts)-new Date(ts).getTimezoneOffset()*6e4).toISOString().slice(0,16);
 dlg(`<h3>${esc(p?p.name:'Entry')} · ${fmt(d)}</h3><label>Dose ${p?U(p):''}</label><input id="ld" type="number" step="any" value="${mg}"><label>Time taken</label><input id="lt" type="datetime-local" value="${loc}">
 <label>Injection site</label><select id="ls"><option></option>${SITES.map(s=>`<option ${l&&l.site===s?'selected':''}>${s}</option>`).join('')}</select>
 <label>Notes / effects</label><textarea id="ln" rows="3">${esc(l?l.notes:'')}</textarea>
 <label>Status</label><select id="lst"><option value="taken">Taken</option><option value="skipped" ${l&&l.status==='skipped'?'selected':''}>Skipped</option></select>
 <p class="g2"><button class="ok" id="lsave">Save</button><button class="sec" onclick="$('#dlg').close()">Cancel</button></p>${l?'<button class="dan" id="ldel" style="width:100%">Delete entry</button>':''}`);
 $('#lsave').onclick=()=>{const e=l||{id:uid(),pid,date:d};Object.assign(e,{doseMg:+$('#ld').value,takenAt:new Date($('#lt').value).toISOString(),site:$('#ls').value,notes:$('#ln').value,status:$('#lst').value});if(!l)S.logs.push(e);save();$('#dlg').close();V[tab]();if(e.status==='taken'&&!l)burst()};
 if(l)$('#ldel').onclick=()=>{if(confirm('Delete entry?')){S.logs=S.logs.filter(x=>x.id!==l.id);save();$('#dlg').close();V[tab]()}}}
function dlg(h){$('#dlg').innerHTML=h;$('#dlg').showModal()}
function editP(id){const p=id?S.protocols.find(x=>x.id===id):{id:uid(),name:'',unit:'mg',vialMg:'',bacMl:'',doseMg:'',stepDate:'',stepDoseMg:'',schedType:'dow',days:[],every:1,time:'09:00',start:today(),end:'',mixed:'',notes:''};
 const F=(k,l,t='number')=>`<div><label>${l}</label><input id="f_${k}" type="${t}" step="any" value="${esc(p[k])}"></div>`;
 dlg(`<h3>${id?'Edit':'Add'} peptide</h3><label>Name</label><input id="f_name" value="${esc(p.name)}"><label>Units</label><select id="f_unit"><option value="mg">mg</option><option value="IU" ${p.unit==='IU'?'selected':''}>IU</option></select><div class="g2">${F('vialMg','Vial amount (mg/IU)')}${F('bacMl','BAC water mL')}${F('doseMg','Dose (mg/IU)')}${F('time','Time','time')}${F('stepDate','Step-up date','date')}${F('stepDoseMg','Step-up dose (mg/IU)')}${F('start','Start','date')}${F('end','End (optional)','date')}${F('mixed','Date mixed','date')}</div>
 <p id="calc" class="big"></p><label>Schedule</label><select id="f_schedType"><option value="dow">Days of week</option><option value="every" ${p.schedType==='every'?'selected':''}>Every X days</option></select>
 <div class="days" id="dw">${DOW.map((d,i)=>`<label><input type="checkbox" value="${i}" ${(p.days||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div>
 <div id="ev">${F('every','Every X days')}</div><label>Notes</label><textarea id="f_notes" rows="2">${esc(p.notes)}</textarea>
 <p class="g2"><button id="psave">Save</button><button class="sec" onclick="$('#dlg').close()">Cancel</button></p>${id?'<button class="dan" id="pdel" style="width:100%">Delete peptide</button>':''}`);
 const sync=()=>{const st=$('#f_schedType').value;$('#dw').style.display=st==='dow'?'':'none';$('#ev').style.display=st==='every'?'':'none';const v=+$('#f_vialMg').value,b=+$('#f_bacMl').value,d=+$('#f_doseMg').value;const un=$('#f_unit').value;$('#calc').textContent=v&&b?`${r2(v/b)} ${un}/mL${d?' · '+r2(d/(v/b)*100)+' units':''}`:''};
 document.querySelectorAll('#dlg input,#dlg select').forEach(e=>e.addEventListener('input',sync));sync();
 $('#psave').onclick=()=>{for(const k of ['unit','name','vialMg','bacMl','doseMg','time','stepDate','stepDoseMg','start','end','mixed','notes','schedType','every'])p[k]=$('#f_'+k).value;
  ['vialMg','bacMl','doseMg','every'].forEach(k=>p[k]=p[k]===''?'':+p[k]);p.days=[...document.querySelectorAll('#dw input:checked')].map(c=>+c.value);
  if(!p.name)return alert('Name required');if(!id)S.protocols.push(p);save();$('#dlg').close();V.prot()};
 if(id)$('#pdel').onclick=()=>{if(confirm('Delete '+p.name+'?')){S.protocols=S.protocols.filter(x=>x.id!==id);save();$('#dlg').close();V.prot()}}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportJ(){dl('peplog-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json')}
function importJ(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.protocols)throw 0;if(confirm('Replace all data with this backup?')){S=d;S.logs=S.logs||[];S.vitals=S.vitals||[];save();go('today')}}).catch(()=>alert('Invalid backup file'))}
function ics(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PepLog//EN','CALSCALE:GREGORIAN'],st=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
 for(let i=0;i<56;i++){const d=addD(today(),i);for(const p of S.protocols)if(due(p,d)){const mg=doseOn(p,d),u=units(p,mg),dt=d.replace(/-/g,'')+'T'+(p.time||'09:00').replace(':','')+'00';
  L.push('BEGIN:VEVENT','UID:'+p.id+'-'+d+'@peplog','DTSTAMP:'+st,'DTSTART:'+dt,'DURATION:PT10M','SUMMARY:'+p.name+' '+mg+' '+U(p)+(u!=null?' ('+u+' units)':''),'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+p.name+' dose','END:VALARM','END:VEVENT')}}
 L.push('END:VCALENDAR');dl('peplog-doses.ics',L.join('\r\n'),'text/calendar')}
// icon + manifest
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0f1115';x.fillRect(0,0,180,180);x.fillStyle='#4f9cff';x.font='bold 90px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('💉',90,96);const u=c.toDataURL();$('#ati').href=u;
 $('#mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'PepLog',short_name:'PepLog',display:'standalone',background_color:'#0f1115',theme_color:'#0f1115',start_url:'.',icons:[{src:u,sizes:'180x180',type:'image/png'}]}))})();
go('today');
</script></body></html>
